# Gateway API HTTPRoute — LAN에서 외부 노출용
# 1-cluster/ansible/roles/istio가 만들어둔 공유 Gateway(istio-system/shared-gateway)에 붙는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garmin-mcp
  namespace: garmin
spec:
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
  hostnames:
    - garmin-mcp.internal
  rules:
    - backendRefs:
        - name: garmin-mcp
          port: 8000
